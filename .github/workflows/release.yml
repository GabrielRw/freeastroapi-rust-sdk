name: Release

# Publishes the freeastroapi crate to crates.io when a v* tag is pushed (for example v0.2.0).
#
# Uses crates.io trusted publishing (OIDC, short-lived token from rust-lang/crates-io-auth-action).
# crates.io only allows trusted publishing for a crate that already exists, so the first
# release needs a CARGO_REGISTRY_TOKEN secret (a crates.io API token with the publish-new
# scope). After that first publish: crates.io -> freeastroapi -> Settings -> Trusted Publishing
# -> Add -> GitHub: owner GabrielRw, repository freeastroapi-rust-sdk, workflow release.yml,
# environment crates-io; then delete the CARGO_REGISTRY_TOKEN secret.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master)
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Check the tag matches Cargo.toml
        run: |
          version="v$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - run: python3 scripts/generate.py --check
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo doc --no-deps --locked
      - name: Authenticate with crates.io (trusted publishing)
        id: auth
        if: env.HAS_TOKEN != 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
