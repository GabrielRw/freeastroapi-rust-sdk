name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets maintainers run CI on the bot-opened spec-sync/auto branch (pull requests opened
  # with GITHUB_TOKEN do not trigger workflows): Actions -> CI -> Run workflow.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master)
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - name: Generated code is current
        run: python3 scripts/generate.py --check
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Unit, transport, coverage and per-operation tests; contract and live tests are ignored.
      - run: cargo test --locked
      - run: cargo doc --no-deps --locked
      - name: native-tls build
        run: cargo check --locked --no-default-features --features native-tls
      - run: cargo publish --dry-run --locked

  msrv:
    # The library (not its dev-dependencies) builds on the rust-version in Cargo.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master)
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - run: cargo check --lib --locked

  generator:
    # The generator against synthetic specs with shapes production does not use yet
    # (typed error bodies, SVG/PNG/markdown/PDF and JSON-or-image responses, 3.1 features).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master)
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - name: Spec tool tests
        run: python3 -m unittest discover -s scripts -p "test_*.py"
      - name: Fixture specs
        run: python3 scripts/check_fixtures.py

  contract:
    # Every SDK method against a Stoplight Prism mock of spec/freeastro.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: cargo test --locked --test contract --no-run
      - name: Contract tests
        run: python3 scripts/with_prism.py -- cargo test --locked --test contract -- --ignored
      - name: Prism log
        if: failure()
        run: tail -n 300 prism.log || true
