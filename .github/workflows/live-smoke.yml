name: Live smoke test

# Five cheap read-only calls against production with the FREEASTRO_TEST_API_KEY secret
# (geo search, moon phase, western sun sign, natal chart, vedic panchang). Skipped with a
# notice when the secret is not set. Retries are off to protect the key's daily quota.

on:
  schedule:
    - cron: "11 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FREEASTRO_TEST_API_KEY: ${{ secrets.FREEASTRO_TEST_API_KEY }}
    steps:
      - name: Check for the API key
        id: key
        run: |
          if [ -z "$FREEASTRO_TEST_API_KEY" ]; then
            echo "::notice title=Live smoke test skipped::Add the FREEASTRO_TEST_API_KEY repository secret to run it."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.key.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (master)
        with:
          toolchain: stable
      - if: steps.key.outputs.present == 'true'
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - if: steps.key.outputs.present == 'true'
        run: cargo test --locked --test live -- --ignored --test-threads 1
